services:
  homebridge:
    image: homebridge/homebridge:latest # sha256:77c685a40911b3b95448f3550be0c8b94cd7b4e66daecc1cc39a8285be75b245
    container_name: homebridge
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Warsaw
      - HOMEBRIDGE_CONFIG_UI=1              # MANDATORY when using mapped ports (Bridge mode)
      - HOMEBRIDGE_CONFIG_UI_PORT=8581
      - HOMEBRIDGE_CONFIG_UI_HOST=0.0.0.0   # Forces IPv4 binding for UI (bypasses config.json manual edits)
      - ENABLE_AVAHI=0                      # Disables container-level mDNS conflict
    volumes:
      - ./volumes/homebridge:/homebridge
      - /var/run/dbus:/var/run/dbus         # Grants access to host's Avahi daemon
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest # sha256:6d164540a04f49ba4e696cbdb70f9fee78be1e94b8f2a1292743a0b1ab8275bd
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "127.0.0.1:8428:8428"   # Only accessible internally
    environment:
      - TZ=Europe/Warsaw
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Maps host.docker.internal to Pi's bridge IP
    volumes:
      - ./volumes/victoria-metrics-data:/victoria-metrics-data
      - ./prometheus.yml:/etc/prometheus.yml:ro
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=2y"
      - "--promscrape.config=/etc/prometheus.yml"
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest # sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - '/:/host:ro,rslave'
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"

  grafana:
    image: grafana/grafana:latest # sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Warsaw
    volumes:
      - ./volumes/grafana:/var/lib/grafana
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10mb"
        max-file: "1"
